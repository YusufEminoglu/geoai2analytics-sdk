[build-system]
# setuptools>=77 is required for the PEP 639 SPDX ``license = "MIT"`` string below.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai2analytics-sdk"
version = "0.12.2"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Spatial statistics and GeoAI in Python: Moran's I, LISA, Getis-Ord Gi*, GWR/MGWR, spatial regression, kriging and explainable AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "spatial-statistics",
    "spatial-econometrics",
    "geoai",
    "gwr",
    "mgwr",
    "lisa",
    "morans-i",
    "spatial-autocorrelation",
    "shap",
    "xai",
    "conformal-prediction",
    "spatial-weights",
    "gis",
    "urban-analytics",
    "getis-ord",
    "hotspot-analysis",
    "kriging",
    "spatial-regression",
    "geostatistics",
    "pysal-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # numpy>=1.22 is required for the ``method=`` keyword of np.quantile.
    "numpy>=1.22.0",
]

[project.optional-dependencies]
# Optional companion stack for GeoPandas/Shapely interoperability and
# SciPy/scikit-learn-based downstream modelling. The core library itself
# only imports NumPy and the Python standard library.
geo = [
    "scipy>=1.7.0",
    "shapely>=2.0.0",
    "geopandas>=0.12.0",
    "scikit-learn>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
geoai2analytics = "geoai2analytics.cli:main"

[project.urls]
Homepage = "https://geophilo.com/"
Repository = "https://gitlab.com/geospacephilo/geoai2analytics-sdk"
GitHub = "https://github.com/YusufEminoglu/geoai2analytics-sdk"
Issues = "https://github.com/YusufEminoglu/geoai2analytics-sdk/issues"
Documentation = "https://geophilo.com/geoai2analytics-sdk/"
Changelog = "https://gitlab.com/geospacephilo/geoai2analytics-sdk/-/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoai2analytics = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".venv",
    "build",
    "dist",
    "build_geoai2analytics_docs.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["geoai2analytics"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
